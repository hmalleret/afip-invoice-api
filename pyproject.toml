[project]
name = "afip-invoice-api"
version = "1.0.0"
description = "AFIP/LATAM electronic invoice extraction API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "google-genai>=1.0.0",
    "pyzbar>=0.1.9",
    "pdfplumber>=0.11.0",
    "xmltodict>=0.13.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "pybreaker>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
